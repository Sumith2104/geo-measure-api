services:
  api:
    build: .
    ports: ["8000:8000"]
    environment:
      GEO_DATABASE_URL: postgresql+psycopg://geo:geo@db:5432/geo
    depends_on: [db]
    volumes: ["./data:/app/data"]
  db:
    image: postgres:16
    environment: {POSTGRES_USER: geo, POSTGRES_PASSWORD: geo, POSTGRES_DB: geo}
